spring.application.name=libertadores-backend
server.port=${PORT:8080}

# PostgreSQL: configurado en DataSourceConfig.java (variable DATABASE_URL en Render)
# Clave AES-256 (32 bytes en Base64). En producción usar variable de entorno AES_SECRET_KEY
# Base64 de 32 bytes (256 bits). Generar en producción: openssl rand -base64 32
app.aes.secret-key=${AES_SECRET_KEY:MDEyMzQ1Njc4OUFCREVGMDEyMzQ1Njc4OUFCREVGMA==}

# CORS para frontend separado
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://libertadores-aduana.github.io}

app.frontend.base-url=${FRONTEND_URL:http://localhost:5500}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@libertadores.cl}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size-mb=5

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
